[project]
name = "snapmemories"
version = "2.0.0"
description = "Save all your Snapchat Memories to your computer with dates, GPS and overlays."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[project.scripts]
snapmemories = "snapmemories.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-requests>=2.33.0.20261006",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S", "ANN"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

[tool.mypy]
strict = true
python_version = "3.14"
packages = ["snapmemories", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
